name: Airbnb CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "727974228658"
  ECR_REGISTRY: "727974228658.dkr.ecr.eu-north-1.amazonaws.com"
  BACKEND_REPOSITORY: airbnb-backend
  FRONTEND_REPOSITORY: airbnb-frontend
  EC2_INSTANCE_ID: i-050cf961af4fb2fc8
  SSM_DOCUMENT: Airbnb-Deploy-v2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::727974228658:role/GitHubActions-Airbnb-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image
        run: |
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/${BACKEND_REPOSITORY}:${{ steps.image.outputs.tag }}" \
            ./server

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://51.20.189.151:8000 \
            -t "${ECR_REGISTRY}/${FRONTEND_REPOSITORY}:${{ steps.image.outputs.tag }}" \
            ./client

      - name: Push backend image
        run: |
          docker push \
            "${ECR_REGISTRY}/${BACKEND_REPOSITORY}:${{ steps.image.outputs.tag }}"

      - name: Push frontend image
        run: |
          docker push \
            "${ECR_REGISTRY}/${FRONTEND_REPOSITORY}:${{ steps.image.outputs.tag }}"

      - name: Deploy to Airbnb EC2
        id: deploy
        run: |
          BACKEND_IMAGE="${ECR_REGISTRY}/${BACKEND_REPOSITORY}:${{ steps.image.outputs.tag }}"
          FRONTEND_IMAGE="${ECR_REGISTRY}/${FRONTEND_REPOSITORY}:${{ steps.image.outputs.tag }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "${SSM_DOCUMENT}" \
            --parameters \
              "BackendImage=${BACKEND_IMAGE},FrontendImage=${FRONTEND_IMAGE}" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: ${COMMAND_ID}"

      - name: Wait for deployment
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text)

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: ${STATUS}"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --output json
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "Deployment timed out while waiting for SSM."
          exit 1
